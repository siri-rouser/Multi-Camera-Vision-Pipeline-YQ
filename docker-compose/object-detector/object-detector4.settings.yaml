model:
  weights_path: /code/retrained_yolo11n.engine
  device: "cuda"
  confidence_threshold: 0.35
  iou_threshold: 0.4
  nms_agnostic: TRUE
  fp16_quantization: TRUE

# for the inference img size, bigger should be better, for the previous MCMT WP, i am using [1280,1280] 
inference_size: [ 1120, 672 ]
classes: [ 0 ]
max_batch_size: 1
max_batch_interval: 0
motion_detect: False
motion_threshold: 300
log_level: DEBUG
redis:
  host: redis
  port: 6379
  stream_ids: 
    - stream4