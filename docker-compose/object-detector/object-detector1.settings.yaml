model:
  weights_path: /code/yolo11l.pt
  device: "cuda"
  confidence_threshold: 0.2
  iou_threshold: 0.2
  nms_agnostic: TRUE
  fp16_quantization: TRUE

# for the inference img size, bigger should be better, for the previous MCMT WP, i am using [1280,1280] 
inference_size: [640,544]
classes: [2,5,7]
max_batch_size: 1
max_batch_interval: 0
motion_detect: False
motion_threshold: 300
log_level: INFO
redis:
  host: redis
  port: 6379
  stream_ids: 
    # - stream4
    # - stream3 
    # - stream2 
    - stream1